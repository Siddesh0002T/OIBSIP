<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700;800&amp;display=swap');
      .cert-title { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 24px; fill: #264653; }
      .cert-desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 15px; fill: #64748B; }
      .cert-sub { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; fill: #475569; }
      .status-text { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px; fill: #FFFFFF; letter-spacing: 1px; }
    </style>

    <!-- Shadows -->
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Main Cream Background Card -->
  <rect x="20" y="20" width="1160" height="200" rx="20" fill="#FFF9F2" stroke="#EFE5DA" stroke-width="2" filter="url(#shadow-soft)" />

  <!-- Left Icon Circle -->
  <g transform="translate(60, 60)">
    <rect width="80" height="80" rx="20" fill="#FFF2E5" stroke="#F5E1D0" stroke-width="1.5" />
    <text x="40" y="52" font-size="38" text-anchor="middle">📜</text>
  </g>

  <!-- Text Content Area -->
  <g transform="translate(170, 70)">
    <text x="0" y="15" class="cert-title">Oasis Infobyte Internship Completion Certificate &amp; Recommendation Letter</text>
    <text x="0" y="45" class="cert-desc">Official verification certificates and appreciation letters for Level 3 (Web Development &amp; Designing Track).</text>
    <text x="0" y="72" class="cert-sub">📂 Location: <tspan fill="#E63946" font-weight="600">./assets/certificates/</tspan> — Will be updated upon project evaluation.</text>
  </g>

  <!-- Right Side 'Coming Soon' Badge -->
  <g transform="translate(930, 80)">
    <rect width="210" height="50" rx="25" fill="#F4A261" stroke="#E9C46A" stroke-width="1.5" />
    <text x="105" y="32" class="status-text" text-anchor="middle">⏳ COMING SOON</text>
  </g>
</svg>
