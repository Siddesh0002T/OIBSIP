<svg width="1200" height="240" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <!-- Fonts -->
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700;800&amp;display=swap');
      .cert-title { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 24px; fill: #264653; }
      .cert-desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 15px; fill: #64748B; }
      .cert-sub { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; fill: #475569; }
      .status-text { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px; fill: #FFFFFF; letter-spacing: 1px; }</style>
  <!-- Shadows -->
  <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="110%"/>
 </defs>
 <!-- Main Cream Background Card -->
 <!-- Left Icon Circle -->
 <!-- Text Content Area -->
 <!-- Right Side 'Coming Soon' Badge -->
 <g>
  <title>background</title>
  <rect x="-1" y="-1" width="1202" height="242" id="canvas_background" fill="none"/>
 </g>
