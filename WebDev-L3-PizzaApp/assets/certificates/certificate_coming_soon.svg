  <title>Layer 1</title>
  <rect x="20" y="20" width="1160" height="200" rx="20" fill="#FFF9F2" stroke="#EFE5DA" stroke-width="2" filter="url(#shadow-soft)" id="svg_1"/>
  <g id="svg_2">
   <rect width="80" height="80" rx="20" fill="#FFF2E5" stroke="#F5E1D0" stroke-width="1.5" y="60" x="60" id="svg_3"/>
