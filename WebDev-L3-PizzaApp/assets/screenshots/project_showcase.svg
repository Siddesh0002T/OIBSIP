<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700;800&amp;display=swap');
      .nav-logo { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 22px; fill: #264653; }
      .nav-link { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; fill: #264653; }
      .welcome-title { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 28px; fill: #264653; }
      .welcome-sub { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 15px; fill: #64748B; }
      .section-title { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 22px; fill: #264653; }
      .card-head { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 18px; fill: #264653; }
      .card-desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 13px; fill: #64748B; }
      .price { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 16px; fill: #E63946; }
      .btn-sm { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; fill: #FFFFFF; }
      .url-text { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13px; fill: #475569; }
    </style>

    <!-- Shadows -->
    <filter id="win-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <filter id="card-shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#264653" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Browser Window Outer Frame -->
  <rect x="20" y="20" width="1160" height="780" rx="16" fill="#FFF9F2" stroke="#CBD5E1" stroke-width="1.5" filter="url(#win-shadow)" />

  <!-- Browser Header Bar -->
  <path d="M 20 36 Q 20 20 36 20 L 1164 20 Q 1180 20 1180 36 L 1180 64 L 20 64 Z" fill="#F1F5F9" />
  <line x1="20" y1="64" x2="1180" y2="64" stroke="#E2E8F0" stroke-width="1" />

  <!-- Mac Window Controls -->
  <circle cx="48" cy="42" r="6" fill="#EF4444" />
  <circle cx="68" cy="42" r="6" fill="#F59E0B" />
  <circle cx="88" cy="42" r="6" fill="#10B981" />

  <!-- Address Bar -->
  <rect x="250" y="30" width="700" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <text x="600" y="46" class="url-text" text-anchor="middle">🔒 https://slice-pizza-platform.vercel.app/dashboard</text>

  <!-- WEBPAGE CONTENT AREA -->
  <g transform="translate(60, 90)">
    
    <!-- Top Nav Bar -->
    <g transform="translate(0, 10)">
      <!-- Slice Logo -->
      <g transform="translate(0, -16)">
        <circle cx="14" cy="14" r="14" fill="#E63946" />
        <path d="M 8 18 L 20 10 M 10 13 L 18 13 M 11 20 L 16 6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
      </g>
      <text x="36" y="2" class="nav-logo">Slice</text>

      <!-- Nav Links -->
      <g transform="translate(650, 0)">
        <text x="0" y="0" class="nav-link">🛒 Orders</text>
        <text x="90" y="0" class="nav-link">Wallet</text>
        <text x="160" y="0" class="nav-link">Dashboard</text>
        <!-- Logout Button -->
        <rect x="260" y="-18" width="80" height="32" rx="8" fill="#FEE2E2" />
        <text x="300" y="2" font-family="'Inter', sans-serif" font-weight="600" font-size="13px" fill="#DC2626" text-anchor="middle">Logout</text>
      </g>
    </g>

    <!-- Welcome Header -->
    <g transform="translate(0, 70)">
      <text x="0" y="0" class="welcome-title">Welcome back, Siddhesh More!</text>
      <text x="0" y="24" class="welcome-sub">What are you craving today?</text>
    </g>

    <!-- Your Rewards Card -->
    <g transform="translate(0, 120)">
      <rect width="1080" height="85" rx="14" fill="#FFF2E5" stroke="#F5E1D0" stroke-width="1" filter="url(#card-shadow3)" />
      <!-- Left Gift Icon -->
      <g transform="translate(25, 22)">
        <rect width="40" height="40" rx="10" fill="#E63946" fill-opacity="0.12" />
        <text x="20" y="27" font-size="20" text-anchor="middle">🎁</text>
      </g>
      <text x="80" y="40" font-family="'Poppins', sans-serif" font-weight="700" font-size="17px" fill="#264653">Your Rewards</text>
      <text x="80" y="60" font-family="'Inter', sans-serif" font-size="13px" fill="#64748B">Earn a stamp for every order. Fill the card for a special reward!</text>
      <!-- Stamp Circles -->
      <g transform="translate(720, 22)">
        <circle cx="20" cy="20" r="18" fill="#E63946" />
        <text x="20" y="26" font-size="15" text-anchor="middle" fill="#FFFFFF">🍕</text>
        <circle cx="68" cy="20" r="18" fill="#E63946" />
        <text x="68" y="26" font-size="15" text-anchor="middle" fill="#FFFFFF">🍕</text>
        <circle cx="116" cy="20" r="18" fill="#E63946" />
        <text x="116" y="26" font-size="15" text-anchor="middle" fill="#FFFFFF">🍕</text>
        <circle cx="164" cy="20" r="17" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
        <circle cx="212" cy="20" r="17" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
      </g>
    </g>

    <!-- Feeling Creative Banner Card -->
    <g transform="translate(0, 225)">
      <rect width="1080" height="95" rx="14" fill="#E63946" filter="url(#card-shadow3)" />
      <text x="30" y="40" font-family="'Poppins', sans-serif" font-weight="700" font-size="20px" fill="#FFFFFF">Feeling Creative?</text>
      <text x="30" y="65" font-family="'Inter', sans-serif" font-size="14px" fill="#FFFFFF" opacity="0.9">Design your perfect pizza from scratch with our interactive builder.</text>
      <rect x="850" y="25" width="190" height="44" rx="10" fill="#F4A261" />
      <text x="945" y="52" font-family="'Inter', sans-serif" font-weight="600" font-size="14px" fill="#FFFFFF" text-anchor="middle">Build Your Own Pizza</text>
    </g>

    <!-- Our Specialties Section -->
    <g transform="translate(0, 355)">
      <text x="0" y="0" class="section-title">Our Specialties</text>
      
      <!-- Card 1: Margherita -->
      <g transform="translate(0, 20)">
        <rect width="520" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow3)" />
        <!-- Pizza Graphic Left -->
        <rect x="12" y="12" width="160" height="126" rx="10" fill="#FFF2E5" />
        <circle cx="92" cy="75" r="50" fill="#E9C46A" />
        <circle cx="92" cy="75" r="42" fill="#E63946" />
        <circle cx="92" cy="75" r="35" fill="#FFF9F2" opacity="0.3" />
        <circle cx="75" cy="60" r="7" fill="#B91C1C" />
        <circle cx="110" cy="70" r="8" fill="#B91C1C" />
        <circle cx="85" cy="95" r="7" fill="#B91C1C" />
        <path d="M 95 55 Q 105 60 100 70" stroke="#15803D" stroke-width="3" fill="none" />
        
        <!-- Details Right -->
        <text x="190" y="40" class="card-head">Margherita</text>
        <text x="190" y="62" class="card-desc">Classic cheese and tomato pizza.</text>
        <text x="190" y="118" class="price">₹170</text>
        <rect x="400" y="90" width="100" height="38" rx="8" fill="#E63946" />
        <text x="450" y="114" class="btn-sm" text-anchor="middle">Add to Cart</text>
      </g>

      <!-- Card 2: Veggie Supreme -->
      <g transform="translate(560, 20)">
        <rect width="520" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow3)" />
        <!-- Pizza Graphic Left -->
        <rect x="12" y="12" width="160" height="126" rx="10" fill="#FFF2E5" />
        <circle cx="92" cy="75" r="50" fill="#E9C46A" />
        <circle cx="92" cy="75" r="42" fill="#E63946" />
        <circle cx="70" cy="65" r="6" fill="#15803D" />
        <circle cx="105" cy="60" r="6" fill="#F59E0B" />
        <circle cx="85" cy="90" r="7" fill="#4338CA" />
        <circle cx="110" cy="85" r="6" fill="#15803D" />
        
        <!-- Details Right -->
        <text x="190" y="40" class="card-head">Veggie Supreme</text>
        <text x="190" y="62" class="card-desc">Loaded with crisp veggies &amp; herbs.</text>
        <text x="190" y="118" class="price">₹275</text>
        <rect x="400" y="90" width="100" height="38" rx="8" fill="#E63946" />
        <text x="450" y="114" class="btn-sm" text-anchor="middle">Add to Cart</text>
      </g>
    </g>

    <!-- Recent Orders Section -->
    <g transform="translate(0, 560)">
      <text x="0" y="0" class="section-title">Recent Orders</text>
      
      <!-- Order Card 1 -->
      <g transform="translate(0, 20)">
        <rect width="520" height="75" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow3)" />
        <text x="25" y="32" font-family="'Inter', sans-serif" font-weight="600" font-size="14px" fill="#264653">Order #f6fae7</text>
        <text x="25" y="52" font-family="'Inter', sans-serif" font-size="12px" fill="#64748B">7/25/2026</text>
        <rect x="420" y="18" width="75" height="24" rx="6" fill="#D1FAE5" />
        <text x="457" y="34" font-family="'Inter', sans-serif" font-weight="600" font-size="11px" fill="#065F46" text-anchor="middle">Delivered</text>
        <text x="200" y="44" class="price">₹170</text>
        <text x="457" y="58" font-family="'Inter', sans-serif" font-weight="500" font-size="12px" fill="#E63946" text-anchor="middle">Track Order →</text>
      </g>

      <!-- Order Card 2 -->
      <g transform="translate(560, 20)">
        <rect width="520" height="75" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow3)" />
        <text x="25" y="32" font-family="'Inter', sans-serif" font-weight="600" font-size="14px" fill="#264653">Order #f6fab4</text>
        <text x="25" y="52" font-family="'Inter', sans-serif" font-size="12px" fill="#64748B">7/25/2026</text>
        <rect x="420" y="18" width="75" height="24" rx="6" fill="#D1FAE5" />
        <text x="457" y="34" font-family="'Inter', sans-serif" font-weight="600" font-size="11px" fill="#065F46" text-anchor="middle">Delivered</text>
        <text x="200" y="44" class="price">₹275</text>
        <text x="457" y="58" font-family="'Inter', sans-serif" font-weight="500" font-size="12px" fill="#E63946" text-anchor="middle">Track Order →</text>
      </g>
    </g>

  </g>
</svg>
