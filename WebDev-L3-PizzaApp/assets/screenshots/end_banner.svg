<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700;800&amp;display=swap');
      .welcome-text { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 32px; fill: #264653; }
      .craving-text { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; fill: #64748B; }
      .card-title { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 24px; fill: #264653; }
      .card-subtitle { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 15px; fill: #64748B; }
      .badge-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; fill: #264653; }
    </style>

    <!-- Shadows -->
    <filter id="soft-shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Main Cream Background (Matches Website Theme) -->
  <rect width="1200" height="280" rx="24" fill="#FFF9F2" stroke="#EFE5DA" stroke-width="2" />

  <!-- Top Welcome Header (Exactly like screenshot!) -->
  <g transform="translate(50, 50)">
    <text x="0" y="0" class="welcome-text">Welcome back, Siddhesh More!</text>
    <text x="0" y="28" class="craving-text">Oasis Infobyte Student Internship Program (OIBSIP) · Web Development &amp; Designing Track</text>
  </g>

  <!-- Rewards Style Card (Inspired by 'Your Rewards' card in screenshot) -->
  <g transform="translate(50, 105)">
    <!-- Card Background -->
    <rect width="1100" height="120" rx="18" fill="#FFF2E5" stroke="#F5E1D0" stroke-width="1.5" filter="url(#soft-shadow2)" />
    
    <!-- Left Icon (Gift/Award) -->
    <g transform="translate(35, 36)">
      <rect width="48" height="48" rx="12" fill="#E63946" fill-opacity="0.12" />
      <text x="24" y="32" font-size="24" text-anchor="middle">🏆</text>
    </g>

    <!-- Text Inside Rewards Card -->
    <text x="100" y="52" class="card-title">Developed &amp; Submitted by: Siddhesh More</text>
    <text x="100" y="80" class="card-subtitle">Level 3 Full-Stack MERN Platform · Official Internship Submission Verified</text>

    <!-- Right Side Stamps / Badges (Inspired by the 5 pizza stamp circles in screenshot) -->
    <g transform="translate(730, 36)">
      <!-- Stamp 1 (Filled Red) -->
      <g transform="translate(0, 0)">
        <circle cx="24" cy="24" r="22" fill="#E63946" />
        <text x="24" y="31" font-size="18" text-anchor="middle" fill="#FFFFFF">🍕</text>
      </g>
      <!-- Stamp 2 (Filled Red) -->
      <g transform="translate(56, 0)">
        <circle cx="24" cy="24" r="22" fill="#E63946" />
        <text x="24" y="31" font-size="18" text-anchor="middle" fill="#FFFFFF">🍕</text>
      </g>
      <!-- Stamp 3 (Filled Red) -->
      <g transform="translate(112, 0)">
        <circle cx="24" cy="24" r="22" fill="#E63946" />
        <text x="24" y="31" font-size="18" text-anchor="middle" fill="#FFFFFF">🍕</text>
      </g>
      
      <!-- GitHub Pill Badge -->
      <g transform="translate(180, 5)">
        <rect width="165" height="38" rx="10" fill="#FFFFFF" stroke="#E63946" stroke-width="1.5" />
        <text x="82" y="24" class="badge-text" text-anchor="middle" fill="#E63946">🌐 @siddesh0002T</text>
      </g>
    </g>
  </g>
</svg>
